<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Aniversario</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffd6e7, #ffb3d1);
    font-family: Georgia, serif;
  }
  .carta {
    background: #fff;
    max-width: 340px;
    margin: 20px;
    padding: 30px 24px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
  }
  .corazon {
    font-size: 60px;
    animation: latido 1.2s infinite;
  }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  h1 { color: #e0457b; margin: 10px 0 20px; }
  p { color: #444; line-height: 1.6; font-size: 17px; }
  .firma { color: #e0457b; font-style: italic; margin-top: 25px; }
</style>
</head>
<body>
  <div class="carta">
    <div class="corazon">❤️</div>
    <h1>Feliz Aniversario</h1>
